name: Update AWAvenue Ads List

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pyyaml requests

      - name: Generate list
        run: python .github/workflows/scripts/yaml2list.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add rules/AWAvenue.list
          git commit -m "update: AWAvenue ads list" || exit 0
          git push
